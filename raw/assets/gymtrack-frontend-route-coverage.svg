<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 620" role="img" aria-labelledby="title desc"><title id="title">Gymtrack frontend 35-route visual coverage</title><desc id="desc">Route inventory has 18 dashboard routes, 8 identity and organization routes, 5 administration routes, 2 public routes, and 2 intentional redirects.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#091018"/><stop offset="1" stop-color="#102c24"/></linearGradient></defs><rect width="1260" height="620" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="50" y="59" fill="#e5fff1" font-size="29" font-weight="bold">Gymtrack · UI route coverage</text><text x="50" y="89" fill="#9fc1b2" font-size="16">35 routes accounted for · 33 styled views · 2 redirect-only entries</text><rect x="50" y="123" width="1160" height="86" rx="15" fill="#173c30" stroke="#24cb96" stroke-width="2"/><text x="78" y="161" fill="#74f2c0" font-size="19" font-weight="bold">One visual language</text><text x="78" y="189" fill="#c8e9dc" font-size="15">Dark surfaces · emerald focus/actions · responsive content · contextual loading · existing permission and API contracts</text><rect x="50" y="265" width="400" height="233" rx="15" fill="#182729" stroke="#3ad7a7" stroke-width="2"/><text x="76" y="331" fill="#57e6b1" font-size="53" font-weight="bold">18</text><text x="168" y="321" fill="#f2faf5" font-size="24" font-weight="bold">Dashboard</text><text x="78" y="363" fill="#c7ded2" font-size="16">Members · Memberships · Plans</text><text x="78" y="392" fill="#c7ded2" font-size="16">Staff · Roles · Dashboard</text><text x="78" y="443" fill="#8bc8a8" font-size="15">Persistent sidebar + loading skeletons</text><rect x="468" y="265" width="237" height="233" rx="15" fill="#1c2730" stroke="#5b778a"/><text x="492" y="331" fill="#aed6f1" font-size="53" font-weight="bold">8</text><text x="550" y="319" fill="#f2faf5" font-size="19" font-weight="bold">Identity/recovery</text><text x="492" y="363" fill="#cadae2" font-size="15">Login · Start · Invite</text><text x="492" y="391" fill="#cadae2" font-size="15">Organization selection</text><text x="492" y="419" fill="#cadae2" font-size="15">No-access · No-sites</text><text x="492" y="447" fill="#cadae2" font-size="15">First-site onboarding</text><rect x="723" y="265" width="230" height="233" rx="15" fill="#1c2730" stroke="#5b778a"/><text x="749" y="331" fill="#aed6f1" font-size="53" font-weight="bold">5</text><text x="807" y="319" fill="#f2faf5" font-size="23" font-weight="bold">Admin</text><text x="749" y="363" fill="#cadae2" font-size="15">Organizations</text><text x="749" y="391" fill="#cadae2" font-size="15">Applications</text><text x="749" y="443" fill="#8bc8a8" font-size="15">Separate AdminShell</text><rect x="970" y="265" width="240" height="105" rx="15" fill="#1c2730" stroke="#5b778a"/><text x="994" y="328" fill="#aed6f1" font-size="48" font-weight="bold">2</text><text x="1054" y="311" fill="#f2faf5" font-size="21" font-weight="bold">Public</text><text x="1054" y="343" fill="#cadae2" font-size="14">Landing · Demo</text><rect x="970" y="387" width="240" height="111" rx="15" fill="#1c2730" stroke="#5b778a"/><text x="994" y="451" fill="#e9b988" font-size="48" font-weight="bold">2</text><text x="1054" y="430" fill="#f2faf5" font-size="20" font-weight="bold">Redirect</text><text x="1054" y="460" fill="#cadae2" font-size="14">/admin · /signup</text><text x="50" y="554" fill="#99b8a6" font-size="15">Includes 35 route entries recorded in the final MR ledger. The redirect destinations received no new route UI.</text><text x="50" y="582" fill="#99b8a6" font-size="14">Conceptual diagram · private screenshots and runtime verification remain in GitLab MR !134 and MR !135.</text></g></svg>