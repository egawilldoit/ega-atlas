<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 680" role="img" aria-labelledby="title desc">
<title id="title">Gymtrack verified context and persistent dashboard shell architecture</title>
<desc id="desc">Next.js dashboard layout persists. Each protected page validates its own data and registers a minimal client-side navigation projection. Mismatched or unavailable context produces a neutral sidebar; page loading swaps only the right-hand content.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111a"/><stop offset="1" stop-color="#101a25"/></linearGradient>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L8 4.5 L0 8" fill="none" stroke="#53dbae" stroke-width="1.6"/></marker>
</defs>
<rect width="1370" height="680" fill="url(#bg)"/>
<text x="55" y="51" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#edf7f2">Persistent dashboard shell · data and trust boundaries</text>
<text x="55" y="80" font-family="Arial,sans-serif" font-size="14" fill="#9bafb7">Verified page data drives presentation. Backend authorization remains authoritative.</text>
<rect x="51" y="127" width="380" height="175" rx="14" fill="#192332" stroke="#5a7287" stroke-width="2"/>
<text x="76" y="161" font-family="Arial,sans-serif" font-weight="700" font-size="18" fill="#f3f7f8">Protected server page</text>
<text x="76" y="193" font-family="Arial,sans-serif" font-size="14" fill="#c2d2d8">Existing session and organization checks</text>
<text x="76" y="219" font-family="Arial,sans-serif" font-size="14" fill="#c2d2d8">Existing API request / response validation</text>
<text x="76" y="245" font-family="Arial,sans-serif" font-size="14" fill="#c2d2d8">Owner, Manager and custom-role gates</text>
<text x="76" y="274" font-family="Arial,sans-serif" font-size="12" fill="#8ba3b1">No auth or transport changes</text>
<rect x="488" y="145" width="342" height="138" rx="14" fill="#15362c" stroke="#53dbae" stroke-width="2"/>
<text x="512" y="181" font-family="Arial,sans-serif" font-weight="700" font-size="18" fill="#c9f7e8">WorkspaceScope</text>
<text x="512" y="208" font-family="Arial,sans-serif" font-size="14" fill="#d2eee3">Minimal, verified UI projection</text>
<text x="512" y="233" font-family="Arial,sans-serif" font-size="14" fill="#d2eee3">Organization / role / account label</text>
<text x="512" y="257" font-family="Arial,sans-serif" font-size="13" fill="#8ac7b2">Registration token guards cleanup</text>
<rect x="889" y="127" width="414" height="175" rx="14" fill="#17232a" stroke="#53dbae" stroke-width="2"/>
<text x="912" y="161" font-family="Arial,sans-serif" font-weight="700" font-size="18" fill="#d7f8ed">dashboard/layout.tsx</text>
<text x="912" y="192" font-family="Arial,sans-serif" font-size="14" fill="#c4dad2">Persistent DashboardShellProvider</text>
<text x="912" y="218" font-family="Arial,sans-serif" font-size="14" fill="#c4dad2">Real DashboardFrame / sidebar / collapse</text>
<text x="912" y="243" font-family="Arial,sans-serif" font-size="14" fill="#c4dad2">Neutral if context absent or mismatched</text>
<text x="912" y="273" font-family="Arial,sans-serif" font-size="12" fill="#92b3a5">No layout API fetch or access decision</text>
<path d="M431 213 H477" stroke="#53dbae" stroke-width="3" marker-end="url(#arr)"/>
<path d="M830 213 H877" stroke="#53dbae" stroke-width="3" marker-end="url(#arr)"/>
<rect x="53" y="363" width="380" height="182" rx="14" fill="#131b24" stroke="#52697d" stroke-width="2"/>
<text x="76" y="398" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f8f8">Route-level loading.tsx</text>
<text x="76" y="427" font-family="Arial,sans-serif" font-size="14" fill="#c2d2d8">Skeletons for list, form and detail</text>
<text x="76" y="454" font-family="Arial,sans-serif" font-size="14" fill="#c2d2d8">Only destination content is replaced</text>
<text x="76" y="481" font-family="Arial,sans-serif" font-size="14" fill="#c2d2d8">No fake sidebar or identity</text>
<text x="76" y="516" font-family="Arial,sans-serif" font-size="12" fill="#8ba3b1">Announced to assistive technology</text>
<rect x="488" y="365" width="342" height="180" rx="14" fill="#2b231b" stroke="#dfad73" stroke-width="2"/>
<text x="511" y="400" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fbe7cd">Failure / mismatch path</text>
<text x="511" y="427" font-family="Arial,sans-serif" font-size="14" fill="#e9d6bd">Wrong organization URL → neutral</text>
<text x="511" y="453" font-family="Arial,sans-serif" font-size="14" fill="#e9d6bd">Denied / outage → projection clear</text>
<text x="511" y="479" font-family="Arial,sans-serif" font-size="14" fill="#e9d6bd">No client-side authorization grants</text>
<text x="511" y="516" font-family="Arial,sans-serif" font-size="12" fill="#d7ad77">Failure edges require hosted QA</text>
<rect x="889" y="365" width="414" height="180" rx="14" fill="#15362c" stroke="#53dbae" stroke-width="2"/>
<text x="912" y="400" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#d7f8ed">Visible experience</text>
<text x="912" y="427" font-family="Arial,sans-serif" font-size="14" fill="#c4dad2">Same sidebar DOM node on navigation</text>
<text x="912" y="453" font-family="Arial,sans-serif" font-size="14" fill="#c4dad2">Role-filtered links after verification</text>
<text x="912" y="479" font-family="Arial,sans-serif" font-size="14" fill="#c4dad2">Updated active item + pending indicator</text>
<text x="912" y="516" font-family="Arial,sans-serif" font-size="12" fill="#92b3a5">Browser evidence in private MR !135</text>
<path d="M241 303 V350" stroke="#7e9bb1" stroke-width="2" marker-end="url(#arr)"/>
<path d="M659 303 V352" stroke="#dfad73" stroke-width="2" marker-end="url(#arr)"/>
<path d="M1097 303 V352" stroke="#53dbae" stroke-width="3" marker-end="url(#arr)"/>
<text x="56" y="614" fill="#a2b4b8" font-family="Arial,sans-serif" font-size="14">Data flow is conceptual; the source code and all private authentication material stay in GitLab.</text>
<text x="56" y="638" fill="#a2b4b8" font-family="Arial,sans-serif" font-size="14">Known limits: the previous verified same-org projection can remain during pending navigation; remote revocation is learned on the next verification.</text>
</svg>