<title id="title">Gymtrack dashboard loading experience before and after the persistent shell</title>
<desc id="desc">Before: a page-level loading skeleton with an empty sidebar gutter. After: the same real sidebar remains visible and only page content becomes a skeleton. Conceptual illustration, not a product screenshot.</desc>
